<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMAP — F2LLM-v2-0.6B</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem 1.5rem; color: #222; }
    h1 { font-size: 1.2rem; margin-bottom: 0.2rem; }
    p.meta { font-size: 0.85rem; color: #666; margin: 0 0 0.8rem; }
    a.back { font-size: 0.85rem; color: #555; text-decoration: none; }
    a.back:hover { text-decoration: underline; }
    #plot { width: 100%; height: calc(100vh - 110px); min-height: 500px; }
    #status { font-size: 0.85rem; color: #888; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Back</a>
  <h1>UMAP Embeddings — codefuse-ai/F2LLM-v2-0.6B</h1>
  <p class="meta">Color = newsgroup &nbsp;·&nbsp; Shape = source (circle = NWA, triangle = IA)</p>
  <div id="plot"></div>
  <div id="status">Loading data…</div>

  <script>
    (function () {
      const DATA_URL = "data/umap_f2llm.json";

      function ngColor(i, total) {
        const h = Math.round((i * 360) / total);
        return "hsl(" + h + ",70%,50%)";
      }

      const SYMBOL_MAP = { nwa: "circle", ia: "triangle-up" };

      fetch(DATA_URL)
        .then(function (r) {
          if (!r.ok) throw new Error("Failed to load " + DATA_URL + " (" + r.status + ")");
          return r.json();
        })
        .then(function (data) {
          var x = data.x, y = data.y, ng = data.ng, src = data.src;
          var ngNames = data.newsgroup_names, srcNames = data.source_names;
          var n = x.length;

          // Single pass: accumulate points per (newsgroup, source) trace
          var buckets = {};
          for (var ni = 0; ni < ngNames.length; ni++) {
            for (var si = 0; si < srcNames.length; si++) {
              buckets[ni + "_" + si] = { xs: [], ys: [] };
            }
          }
          for (var i = 0; i < n; i++) {
            var b = buckets[ng[i] + "_" + src[i]];
            b.xs.push(x[i]);
            b.ys.push(y[i]);
          }

          var traces = [];
          for (var ni = 0; ni < ngNames.length; ni++) {
            for (var si = 0; si < srcNames.length; si++) {
              var b = buckets[ni + "_" + si];
              if (b.xs.length === 0) continue;
              traces.push({
                type: "scattergl",
                x: b.xs,
                y: b.ys,
                mode: "markers",
                marker: {
                  size: 5,
                  color: ngColor(ni, ngNames.length),
                  symbol: SYMBOL_MAP[srcNames[si]] || "circle",
                  opacity: 0.65,
                },
                name: ngNames[ni] + " (" + srcNames[si] + ")",
                hovertemplate: "<b>" + ngNames[ni] + "</b><br>" + srcNames[si] + "<extra></extra>",
              });
            }
          }

          var layout = {
            xaxis: { title: "UMAP 1", showgrid: false },
            yaxis: { title: "UMAP 2", showgrid: false },
            legend: { font: { size: 11 } },
            margin: { t: 20, b: 50, l: 50, r: 20 },
            paper_bgcolor: "#fff",
            plot_bgcolor: "#f9f9f9",
          };

          Plotly.newPlot("plot", traces, layout, { responsive: true });
          document.getElementById("status").textContent =
            n.toLocaleString() + " messages across " + ngNames.length + " newsgroups";
        })
        .catch(function (err) {
          document.getElementById("status").textContent = "Error: " + err.message;
          console.error(err);
        });
    })();
  </script>
</body>
</html>
