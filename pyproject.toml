[project]
name = "usenet-no"
version = "0.1.0"
description = "Explore norwegian usenet data from internet archive"
authors = [
    {name = "Tita", email = "tita.enstad@nb.no"},
    {name = "Jon", email = "jon.tonnessen@nb.no"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "bertopic>=0.17.4",
    "faust-cchardet>=2.1.19",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.8",
    "matplotlib-venn>=1.1.2",
    "nbformat>=5.10.4",
    "notebook>=7.6.0",
    "pandas>=2.3.3",
    "peft>=0.19.1",
    "plotly>=6.6.0",
    "requests>=2.32.5",
    "sentence-transformers>=5.3.0",
    "torch>=2.4,<2.5",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[project.scripts]
usenet-no = "usenet_no:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
