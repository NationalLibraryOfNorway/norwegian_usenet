[project]
name = "usenet-no"
version = "0.1.0"
description = "Explore norwegian usenet data from internet archive"
authors = [
    {name = "Tita", email = "tita.enstad@nb.no"},
    {name = "Jon", email = "jon.tonnessen@nb.no"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "faust-cchardet>=2.1.19",
    "pandas>=2.3.3",
    "peft>=0.19.1",
    "requests>=2.32.5",
    "scipy>=1.17.1",
    "sentence-transformers>=5.3.0",
    "torch>=2.4,<2.5",
    "tqdm>=4.67.1",
    "turftopic>=0.27.1",
    "umap-learn>=0.5.12",
    "kaleido>=1.3.0",
    "matplotlib>=3.11.1",
    "matplotlib-venn>=1.1.2",
    "networkx>=3.6.1",
    "plotly>=6.6.0",
    "pyvis>=0.3.2",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# pytest's default norecursedirs holds "build", which would skip the tests of
# database.build, whose directory is named after the module it covers. This is
# that default with "build" taken out.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]
